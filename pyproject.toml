[project]
name = "guitool"
version = "2.0.0"
description = ""
authors = [
    {name = "Sony Semiconductor Solutions Corp"},
]
requires-python = "==3.11.*"

dependencies = [
    "guitool-backend",
    "guitool-client"
]

[tool.uv.sources]
guitool-backend = { workspace = true }
guitool-client = { workspace = true }

[tool.uv.workspace]
members = [
    "backend/",
    "client/"
]

[dependency-groups]
dev = [
    "ruff>=0.9.2",
]

[tool.ruff]
line-length = 121

[tool.ruff.lint]
ignore = ["E722"]